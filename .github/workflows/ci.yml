name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests (incl. MariaDB), build (Node 22)
    runs-on: ubuntu-latest
    services:
      mariadb:
        # Hostinger's MySQL is MariaDB. Throwaway CI database, no real data.
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: glow_test
          MARIADB_USER: glow
          MARIADB_PASSWORD: ci-only-password
          MARIADB_RANDOM_ROOT_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://glow:ci-only-password@127.0.0.1:3306/glow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit, integration and database tests (booking concurrency, auth, outbox)
        run: npm test
      - run: npm run build
      - name: Crawl the built site (pages, links, canonical, hreflang, location wording)
        run: |
          PORT=3000 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          node scripts/check-site.mjs http://localhost:3000

  hostinger-build:
    name: Production build (Node 20, as on Hostinger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
